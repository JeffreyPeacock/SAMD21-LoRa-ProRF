; SparkFun Pro RF - LoRa, 915MHz (SAMD21).  Invoice SKU DD-15178, March 2019.
;
; LAYOUT
;   lib/        this project's own shared libraries -- committed. PlatformIO
;               links whichever ones an application #includes.
;   src/apps/   full applications
;   src/tools/  small single-purpose utilities
;   test/       unit tests, `pio test`
;
; One environment per program. build_src_filter picks exactly one main(),
; because PlatformIO compiles everything under src/ otherwise and two main()s
; will not link.
;
; `node` and `radio_tx` transmit; everything else receives only.

; Common to every environment, the host-side tests included.
[env]
build_flags =
  -Wall
  -Wextra
  -Wno-unused-parameter

; Base for everything that runs ON the board. These cannot live in [env]:
; PlatformIO applies [env] to every environment, and the native test platform
; rejects a board ID with "Unknown board ID". Same trap the sibling ESP32
; gateway project documents.
[samd21]
platform  = atmelsam
board     = sparkfun_samd21_proRF
framework = arduino

; The SAMD21's native USB CDC ignores the baud rate; any value connects. 115200
; is written here so the number in the docs matches the number in the tools.
monitor_speed = 115200

; The board carries its own USB serial number -- the SAMD21's 128-bit chip UID
; -- so udev can name it uniquely. Prefer this over /dev/ttyACMn, which is
; assigned in plug order and moves when anything else is connected.
monitor_port = /dev/serial/by-id/usb-SparkFun_SFE_SAMD21_Pro_RF_21A8043C5150484735202020FF09181F-if00

; NO upload_port, deliberately. The by-id name above is the RUNNING SKETCH's:
; it is built from the SAMD21's chip UID, and SAM-BA does not report one. The
; 1200-baud touch therefore makes that exact path disappear, and PlatformIO --
; told to upload to it -- waits forever for a port that will never come back
; under that name:
;
;     Forcing reset using 1200bps open/close on port /dev/serial/by-id/usb-SparkFun_SFE_...
;     Waiting for the new upload port...        <- hangs here
;
; Leaving it unset lets PlatformIO rediscover the board by USB hwid after the
; touch, which is what board_upload.wait_for_upload_port in the board
; definition exists to do. Pinning a port defeats it.

; sam-ba over the native USB port. PlatformIO does the 1200-baud touch that
; drops the board into its bootloader, so uploads need no button press --
; PROVIDED a sketch is running and its USB stack is alive. If the running
; sketch has hung, double-tap RESET by hand first. See docs/programming.md.
upload_protocol = sam-ba

; Library versions are pinned. These are 2019 breakout boards whose libraries
; have had breaking API changes since: SparkFun's CCS811 v2 renamed the status
; enum the 2019 sketch used (CCS811Core::status -> CCS811_Status_e), so an
; unpinned build breaks on someone else's release schedule.
;
[deps]
radio =
  mikem/RadioHead@1.120
sensors =
  sparkfun/SparkFun BME280@2.0.9
  sparkfun/SparkFun CCS811 Arduino Library@2.0.3
datalog =
  sparkfun/SparkFun Qwiic OpenLog@3.0.2
; The SAMD21's hardware RTC. The board has no crystal or backup cell, so this
; is meaningless until the host sets it -- see lib/rtc.
clock =
  arduino-libraries/RTCZero@1.6.0

; --------------------------------------------------------------- applications

; The sensor board: Qwiic chain -> SD card -> LoRa.
[env:sensor]
extends = samd21
build_src_filter = +<apps/sensor/>
lib_deps = ${deps.radio}
           ${deps.sensors}
           ${deps.datalog}
           ${deps.clock}

; The base station: LoRa -> serial + SD, ACK with sequence state and RSSI.
[env:base]
extends = samd21
build_src_filter = +<apps/base/>
lib_deps = ${deps.radio}
           ${deps.datalog}
           ${deps.clock}

; ---------------------------------------------------------------------- tools

; Radio + Qwiic bus, together. Run this first on a board that has gone quiet,
; and after any wiring change. Transmits nothing.
[env:probe]
extends = samd21
build_src_filter = +<tools/probe/>
lib_deps = ${deps.radio}

; Is the I2C BUS working, or is there just nothing on it? Reads the idle
; levels and rise times of SDA/SCL before any addressing happens -- a scan
; cannot tell an empty bus from a broken one.
[env:qwiic_health]
extends = samd21
build_src_filter = +<tools/qwiic_health/>

; I2C bus scan on its own -- no radio, no libraries.
[env:i2c_scan]
extends = samd21
build_src_filter = +<tools/i2c_scan/>

; Listen and report every packet with RSSI and SNR. Decodes this project's
; frames when it recognises them, dumps hex when it does not.
[env:radio_rx]
extends = samd21
build_src_filter = +<tools/radio_rx/>
lib_deps = ${deps.radio}

; Beacon numbered packets, at low power for bench work.
[env:radio_tx]
extends = samd21
build_src_filter = +<tools/radio_tx/>
lib_deps = ${deps.radio}

; Read the SX1276's registers back after configuration and prove a packet
; physically entered TX mode. Run this when the far end reports 0 received.
[env:radio_regs]
extends = samd21
build_src_filter = +<tools/radio_regs/>
lib_deps = ${deps.radio}

; Step transmit power 2 -> 17 dBm, five packets each, with the power written
; into every sentence so the far end's log labels itself. For checking whether
; a reported RSSI tracks transmit power one-for-one.
[env:radio_sweep]
extends = samd21
build_src_filter = +<tools/radio_sweep/>
lib_deps = ${deps.radio}


; Benchmark ONE device at a time on an otherwise idle bus: transaction cost,
; and how much rest the bus needs before the next transaction succeeds.
;   make flash-qwiic_bench DEV=bme280|ccs811|openlog
[env:qwiic_bench]
extends = samd21
build_src_filter = +<tools/qwiic_bench/>

; Exercise the Qwiic OpenLog alone: is it on the bus, what does getStatus()
; say about the microSD card, and does a write actually land?
[env:openlog_test]
extends = samd21
build_src_filter = +<tools/openlog_test/>
lib_deps = ${deps.datalog}

; Read every Qwiic sensor and print it, with no radio and no logging. The tool
; for "is this sensor wired up and sane?" before blaming the application.
[env:qwiic_read]
extends = samd21
build_src_filter = +<tools/qwiic_read/>
lib_deps = ${deps.sensors}
           ${deps.clock}

; ---------------------------------------------------------------------- tests

; Host-side unit tests for the pure logic in lib/nmea and lib/telemetry: float
; formatting, NMEA checksums, frame layout. Runs on the workstation, needs no
; board, and is what `make test` invokes. Anything needing the radio is an
; integration test and belongs in scripts/.
[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -std=c++17

; Compile NOTHING from src/. Everything there is Arduino firmware and pulls in
; <Arduino.h>, which does not exist on the host. `pio test -e native` supplies
; its own main() from the Unity runner, so this environment needs no src at
; all -- only test/ and whichever lib/ components the tests include.
build_src_filter = -<*>
